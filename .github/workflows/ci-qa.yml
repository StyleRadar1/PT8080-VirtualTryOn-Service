name: CD QA · PT8080-VirtualTryOn-Service

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  IMAGE_NAME: pt8080-virtualtryon-service

jobs:
  test-and-sonar:
    name: Pruebas, Cobertura JaCoCo y SonarQube Gate (A)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Otorgar permisos a Maven Wrapper
        run: chmod +x mvnw

      - name: Ejecutar pruebas y verificar cobertura JaCoCo (>= 85%)
        run: ./mvnw -B clean verify

      - name: Ejecutar análisis SonarQube / SonarCloud
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=true

      - name: Publicar reporte de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-qa
          path: target/site/jacoco/

  build-push-qa:
    name: Construir y publicar imagen QA en Docker Hub
    needs: test-and-sonar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Despliegue en Azure App Service QA (probador_db_qa)
    needs: build-push-qa
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://${{ secrets.AZURE_WEBAPP_NAME_QA }}.azurewebsites.net/swagger-ui/index.html
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar variables de entorno del App Service QA
        uses: azure/cli@v2
        with:
          inlineScript: |
            RG=$(az webapp list --query "[?name=='${{ secrets.AZURE_WEBAPP_NAME_QA }}'].resourceGroup | [0]" -o tsv)
            az webapp config appsettings set \
              --name "${{ secrets.AZURE_WEBAPP_NAME_QA }}" \
              --resource-group "$RG" \
              --output none \
              --settings \
                WEBSITES_PORT=8500 \
                SERVER_PORT=8500 \
                SPRING_PROFILES_ACTIVE=qa \
                DB_URL="${{ secrets.DB_URL_QA }}" \
                DB_USER="${{ secrets.DB_USERNAME_QA }}" \
                DB_PASSWORD="${{ secrets.DB_PASSWORD_QA }}" \
                JWT_SECRET_BASE64="${{ secrets.JWT_SECRET_QA }}" \
                AZURE_STORAGE_BASE_URL="${{ secrets.AZURE_STORAGE_BASE_URL_QA }}" \
                AZURE_SAS_TOKEN="${{ secrets.AZURE_SAS_TOKEN_QA }}" \
                AZURE_READ_SAS_TOKEN="${{ secrets.AZURE_READ_SAS_TOKEN_QA }}" \
                REDIS_HOST="${{ secrets.REDIS_HOST }}" \
                REDIS_PORT="${{ secrets.REDIS_PORT }}" \
                REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
                RABBITMQ_HOST="${{ secrets.RABBITMQ_HOST }}" \
                RABBITMQ_PORT="${{ secrets.RABBITMQ_PORT }}" \
                RABBITMQ_USER="${{ secrets.RABBITMQ_USER }}" \
                RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD }}"

      - uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_QA }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:qa-${{ github.sha }}

      - name: Smoke Test en Azure QA (/v3/api-docs y /actuator/health)
        run: |
          URL="https://${{ secrets.AZURE_WEBAPP_NAME_QA }}.azurewebsites.net/v3/api-docs"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)
            echo "Intento $i: $STATUS"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "El servicio no respondió en $URL"
          exit 1

