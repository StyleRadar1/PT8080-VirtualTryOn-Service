name: CI Pipeline · PT8080-VirtualTryOn-Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      run_live_qa_smoke:
        description: 'Ejecutar smoke test con FASHN AI real y credenciales de QA'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test & JaCoCo Coverage (PR Pipeline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Execute Maven Clean Verify (Unit, Contract & Testcontainers)
        run: ./mvnw clean verify -B

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

  docker-build-check:
    name: Verify Docker Container Build
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Packaging Validation)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: styleradar/pt8080-virtualtryon-service:ci-test

  qa-live-smoke:
    name: QA Protected · FASHN AI Live Smoke Test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_qa_smoke == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Execute FASHN AI Live Smoke Test
        env:
          FASHN_LIVE_API_KEY: ${{ secrets.FASHN_LIVE_API_KEY }}
        run: ./mvnw test -Dtest=FashnAiLiveIntegrationTest -B

