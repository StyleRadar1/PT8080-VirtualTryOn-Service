# ===================================================================
# StyleRadar - PT8080-VirtualTryOn-Service (ms-probador-virtual)
# Squad Portal8080 (DOSW 2026)
# ===================================================================

server:
  port: ${SERVER_PORT:8500}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    context-path: /


spring:
  application:
    name: PT8080-VirtualTryOn-Service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Configuración Multipart para carga de siluetas de hasta 5 MB (SR-RF-23)
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}

  # Configuración de Jackson para JSON estándar
  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false

  # Configuración de RabbitMQ con Publisher Confirms para el Transactional Outbox
  rabbitmq:
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    publisher-confirm-type: correlated
    publisher-returns: true

  # Migraciones de esquema PostgreSQL con Flyway
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

# Documentación interactiva OpenAPI 3.0 / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

# Endpoints de monitoreo y health checks OCI
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
    git:
      mode: full
      enabled: true
    build:
      enabled: true

# Metadatos del despliegue para verificación de Smoke Tests (Commit SHA y Build)
info:
  app:
    name: "pt8080-virtualtryon-service"
    version: "1.0.0-SNAPSHOT"
    description: "Microservicio de Probador Virtual con IA"
  git:
    commit:
      id: ${git.commit.id:${APP_GIT_COMMIT_SHA:unknown}}

# Configuración transversal de seguridad JWT y almacenamiento Azure Blob Storage
# Las credenciales (JWT_SECRET_BASE64 y AZURE_STORAGE_ACCOUNT_KEY) deben inyectarse por variables de entorno o secretos de despliegue
styleradar:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      duration: ${JWT_DURATION:PT60M}
  tryon:
    # Proxies/ingress (IP o CIDR) cuyas cabeceras X-Forwarded-For / X-Real-IP se aceptan para registrar la IP.
    trusted-proxies: ${TRYON_TRUSTED_PROXIES:127.0.0.1,::1}
    security:
      allow-localhost-urls: ${ALLOW_LOCALHOST_URLS:false}
    # El proveedor real se habilita exclusivamente en qa/prod. Los perfiles locales
    # deben declarar mock explícitamente para evitar consumo accidental de FASHN.
    ai-provider: ${TRYON_AI_PROVIDER:mock}
    daily-quota-limit: ${TRYON_DAILY_QUOTA_LIMIT:${TRYON_MONTHLY_QUOTA_LIMIT:10}}
    fashn-api-url: ${FASHN_API_URL:https://api.fashn.ai/v1}
    fashn-api-key: ${FASHN_API_KEY:}
    fashn-total-timeout: ${FASHN_TOTAL_TIMEOUT:PT25S}
    usuarios-service-url: ${USUARIOS_SERVICE_URL:http://localhost:8120}
    usuarios-measurements-path: ${USUARIOS_MEASUREMENTS_PATH:/api/v1/internal/users/{userId}/measurements}
    usuarios-internal-auth-username: ${USUARIOS_INTERNAL_AUTH_USERNAME:}
    usuarios-internal-auth-password: ${USUARIOS_INTERNAL_AUTH_PASSWORD:}
    catalogo-service-url: ${CATALOGO_SERVICE_URL:http://localhost:8220}
    blob-base-url: ${AZURE_STORAGE_BASE_URL:https://styleradarpt8080blob.blob.core.windows.net}
    blob-container: ${AZURE_STORAGE_CONTAINER:biometric-silhouettes}
    blob-account-key: ${AZURE_STORAGE_ACCOUNT_KEY}
    blob-read-sas-duration: ${AZURE_READ_SAS_DURATION:PT15M}
    estimated-processing-duration: ${TRYON_ESTIMATED_PROCESSING_DURATION:PT25S}
    blob-api-version: ${AZURE_STORAGE_API_VERSION:2024-11-04}
    outbox:
      poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}
      dispatch-enabled: ${OUTBOX_DISPATCH_ENABLED:true}
    amqp:
      retry:
        max-attempts: ${TRYON_AMQP_RETRY_MAX_ATTEMPTS:4}
        initial-interval-ms: ${TRYON_AMQP_RETRY_INITIAL_INTERVAL_MS:2000}
        multiplier: ${TRYON_AMQP_RETRY_MULTIPLIER:2.0}
        max-interval-ms: ${TRYON_AMQP_RETRY_MAX_INTERVAL_MS:10000}
    stale-job:
      enabled: ${STALE_JOB_SWEEP_ENABLED:true}
      sweep-interval-ms: ${STALE_JOB_SWEEP_INTERVAL_MS:60000}
      initial-delay-ms: ${STALE_JOB_INITIAL_DELAY_MS:10000}
      max-processing-age-minutes: ${STALE_JOB_MAX_PROCESSING_AGE_MINUTES:10}

# Circuit Breaker para tolerancia a fallos de la API externa de FASHN AI
resilience4j:
  circuitbreaker:
    instances:
      fashnAi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - edu.dosw.styleradar.virtualtryon.domain.exception.AiInferencePermanentException

