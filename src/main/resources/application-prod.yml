# ===================================================================
# Perfil de Producción en Nube (prod)
# Microservicio: PT8080-VirtualTryOn-Service · Base de datos: probador_db_prod
# ===================================================================

spring:
  config:
    activate:
      on-profile: prod

  # Persistencia PostgreSQL aislada en Azure para Producción (probador_db_prod)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Caching Redis en Producción (conectado al device único compartido de Redis)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2000ms

  # Broker de Mensajería RabbitMQ en Producción (conectado al broker único compartido)
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Configuración de monitoreo restringida en Producción (OWASP A05 Security Misconfiguration)
management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}
  endpoint:
    health:
      show-details: when_authorized

# Parámetros del Negocio Virtual Try-On en Producción
styleradar:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://styleradar.co,https://styleradar-prod.azurewebsites.net}
  tryon:
    ai-provider: ${TRYON_AI_PROVIDER:fashn}
    daily-quota-limit: ${MAX_DAILY_QUOTA:10}
    fashn-api-url: ${FASHN_API_URL:https://api.fashn.ai/v1}
    fashn-api-key: ${FASHN_API_KEY:}
    blob-container: ${AZURE_STORAGE_CONTAINER:biometric-silhouettes-prod}
    amqp:
      listeners-enabled: ${TRYON_AMQP_LISTENERS_ENABLED:false}

