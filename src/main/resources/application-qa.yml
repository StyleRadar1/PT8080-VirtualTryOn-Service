# ===================================================================
# Perfil de Calidad / Homologación en Azure Cloud (qa)
# Microservicio: PT8080-VirtualTryOn-Service · Base de datos: probador_db_qa
# ===================================================================

spring:
  config:
    activate:
      on-profile: qa

  # Persistencia PostgreSQL aislada en Azure para QA (probador_db_qa)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Caching Redis en QA
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # Broker de Mensajería RabbitMQ en QA
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}

# Documentación interactiva OpenAPI 3.0 activa en QA para validación del Sprint
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true

# Parámetros del Negocio Virtual Try-On en QA
styleradar:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://styleradar-qa.azurewebsites.net}
  tryon:
    ai-provider: ${TRYON_AI_PROVIDER:fashn}
    daily-quota-limit: ${MAX_DAILY_QUOTA:10}
    fashn-api-url: ${FASHN_API_URL:https://api.fashn.ai/v1}
    fashn-api-key: ${FASHN_API_KEY:}
    blob-container: ${AZURE_STORAGE_CONTAINER:biometric-silhouettes-qa}
    blob-account-key: ${AZURE_STORAGE_ACCOUNT_KEY}
    amqp:
      publisher-confirms: true
      listeners-enabled: ${TRYON_AMQP_LISTENERS_ENABLED:true}
