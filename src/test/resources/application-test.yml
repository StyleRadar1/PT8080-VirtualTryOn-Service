# ===================================================================
# Perfil de Testing Automatizado (test)
# ===================================================================

spring:
  config:
    activate:
      on-profile: test

  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:probador_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # Excluimos brokers externos en pruebas unitarias/contexto base
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

styleradar:
  security:
    jwt:
      secret-base64: U3R5bGVSYWRhclZpcnR1YWxUcnlPblNlY3JldEtleTIwMjZQb3J0YWw4MDgwU2Vj
      duration: PT60M
  tryon:
    ai-provider: mock
    daily-quota-limit: 10
    blob-base-url: https://styleradarblob.blob.core.windows.net
    blob-container: biometric-silhouettes
    blob-account-key: U3R5bGVSYWRhclRlc3RTdG9yYWdlQWNjb3VudEtleTIwMjZQb3J0YWw4MDgwU2Vj
    blob-read-sas-duration: PT60M
    blob-api-version: 2024-11-04
    amqp:
      listeners-enabled: false

